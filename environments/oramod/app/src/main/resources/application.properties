spring.datasource.url=${CATALOG_DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${CATALOG_DB_USER:catalog}
spring.datasource.password=${CATALOG_DB_PASSWORD:catalog}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.open-in-view=false

catalog.editor-password=${CATALOG_EDITOR_PASSWORD:editor}
catalog.price-feed-url=${CATALOG_PRICE_FEED_URL:http://localhost:9/none}

server.port=8080
