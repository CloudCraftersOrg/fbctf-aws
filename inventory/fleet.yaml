    hostname: ip-10-20-10-205.ec2.internal
    ip: 10.20.10.205
    os: { name: Linux, version: Ubuntu 16.04.7 LTS }
    cpu: { sockets: 1, cores_per_socket: 1, peak: 48.44, avg: 1.22 }
    ram: { total: 2048, peak: 17.4, avg: 17.4 }
    storage: { total: 30, used_pct: 9 }
