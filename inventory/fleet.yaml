# Simulated "before" estate for the AWS Transform assessment demo.
#
# The two i-* entries mirror the live fbctf app in environments/demo (same
# instance IDs, OS, and utilisation as the validated MPA upload). Every other
# host is synthetic but internally consistent: specs, utilisation and the
# dependency edges in connections.yaml all line up so Transform produces a
# coherent wave plan.
#
# generate.py turns this file + connections.yaml into the two CSVs Transform's
# Migration Portfolio Assessment ingests. Field meanings match the MPA "Server"
# import columns exactly:
#   ram.*      megabytes
#   storage.*  total in GB, used_pct as a percentage
#   cpu.peak / cpu.avg / ram.*  percentages
#
# "signal" is documentation only — it records which Transform finding each host
# is here to exercise. It is not emitted to the CSV.

defaults:
  environment: Production
  hypervisor: KVM
  datacenter: aws-us-east-1a
  threads_per_core: 2

servers:
  # The two i-* hosts must stay byte-identical to the validated MPA upload.
